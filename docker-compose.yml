services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moneymoney}
      POSTGRES_USER: ${POSTGRES_USER:-moneymoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneymoney}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moneymoney} -d ${POSTGRES_DB:-moneymoney}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moneymoney}:${POSTGRES_PASSWORD:-moneymoney}@postgres:5432/${POSTGRES_DB:-moneymoney}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      MOCK_DATA_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      args:
        FASTAPI_URL: http://backend:8000
    environment:
      FASTAPI_URL: http://backend:8000
      DATABASE_URL: file:./data/moneymoney.db
    volumes:
      - web_data:/app/data
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  web_data:
